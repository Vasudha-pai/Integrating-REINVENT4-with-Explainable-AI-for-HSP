[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hsp-xai"
version = "0.1.0"
description = "Explainable AI-guided de novo design of HSP90 inhibitors with REINVENT4"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

# Install this package in editable mode so `import hsp_xai` works anywhere:
#   pip install -e .
